# What tools/preview.py shows (docs/PREVIEW.md): a media player that is muted, with all three keys; a media player that
# is not, across a tile and down a tall one; an IR remote with only quieter and louder; a key whose text is not an
# action; a channel tile (channel down and up); and a tile whose keys have no action yet.
tiles:
  - tile: volume
    name: Living room
    entity: media_player.living_room
    options:
      down: media_player.volume_down
      mute: media_player.volume_mute is_volume_muted=true
      up: media_player.volume_up
    sizes: [1x1, 2x1, 1x2, 2x2, 3x3]
  - tile: volume
    name: Kitchen
    entity: media_player.kitchen
    options:
      down: media_player.volume_down
      mute: media_player.volume_mute is_volume_muted=true
      up: media_player.volume_up
    sizes: [1x1, 1x2]
  - tile: volume
    name: Amplifier
    entity: remote.amplifier
    options:
      down: remote.send_command command=VOLUME_DOWN
      up: remote.send_command command=VOLUME_UP
    sizes: [1x1, 1x2]
  - tile: volume
    name: Hall
    entity: media_player.hall
    options:
      down: lower the volume
      mute: media_player.volume_mute is_volume_muted=true
      up: media_player.volume_up
    sizes: [1x1, 1x2]
  - tile: volume
    name: Bar TV
    entity: media_player.bar_tv
    options:
      style: channel
      down: webostv.button button=CHANNELDOWN
      up: webostv.button button=CHANNELUP
    sizes: [1x1, 2x1, 1x2]
  - tile: volume
    name: Not set up
    sizes: [1x1, 1x2]

states:
  media_player.living_room:
    state: playing
    attributes: { friendly_name: Living room, is_volume_muted: true }
  media_player.kitchen:
    state: playing
    attributes: { friendly_name: Kitchen, is_volume_muted: false }
  remote.amplifier:
    state: "on"
    attributes: { friendly_name: Amplifier }
  media_player.bar_tv:
    state: playing
    attributes: { friendly_name: Bar TV }
  media_player.hall:
    state: playing
    attributes: { friendly_name: Hall, is_volume_muted: false }
